<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL KONTROL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0d0d0d; 
            font-family: 'Courier New', monospace;
            color: #00ffaa;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            border-bottom: 1px solid #00ffaa33;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-weight: 300;
            font-size: 22px;
            letter-spacing: 4px;
        }
        .status-badge {
            background: #00ffaa22;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid #00ffaa55;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .video-container {
            background: #111;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            overflow: hidden;
            position: relative;
        }
        #liveFeed {
            width: 100%;
            background: #000;
            display: block;
            min-height: 400px;
            object-fit: cover;
        }
        .video-overlay {
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-size: 11px;
            color: #666;
            background: #00000088;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .panel {
            background: #111;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            padding: 20px;
        }
        .panel h3 {
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 14px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #888;
        }
        .log {
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.8;
            color: #aaa;
        }
        .log .entry {
            border-bottom: 1px solid #1a1a1a;
            padding: 4px 0;
        }
        .log .entry .time {
            color: #555;
            margin-right: 10px;
        }
        .log .entry .success {
            color: #00ffaa;
        }
        .log .entry .info {
            color: #66ccff;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: transparent;
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .btn:hover {
            border-color: #00ffaa;
            color: #00ffaa;
            background: #00ffaa11;
        }
        .btn.danger:hover {
            border-color: #ff4444;
            color: #ff4444;
            background: #ff444411;
        }
        .btn.active {
            border-color: #00ffaa;
            color: #00ffaa;
            background: #00ffaa22;
        }
        .target-info {
            font-size: 13px;
            color: #888;
            margin-top: 10px;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 6px;
            border-left: 3px solid #00ffaa;
        }
        .target-info strong {
            color: #fff;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #333;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
            letter-spacing: 1px;
        }
        #snapshotContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        #snapshotContainer img {
            width: 60px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>◈ PANEL KONTROL</h1>
        <span class="status-badge">● ONLINE — 1 TARGET</span>
    </div>

    <div class="grid">
        <!-- Kiri: Live Feed -->
        <div class="video-container">
            <img id="liveFeed" src="" alt="Menunggu stream...">
            <div class="video-overlay">● LIVE — TARGET-001</div>
        </div>

        <!-- Kanan: Panel Kontrol -->
        <div class="panel">
            <h3>⎔ KONTROL & LOG</h3>
            
            <div class="target-info">
                <strong>Target:</strong> TARGET-001<br>
                <strong>Status:</strong> <span style="color:#00ffaa;">● Terhubung</span><br>
                <strong>Durasi:</strong> <span id="duration">00:00</span>
            </div>

            <div class="controls">
                <button class="btn active" id="btnStart">▶ MULAI</button>
                <button class="btn danger" id="btnStop">■ HENTIKAN</button>
                <button class="btn" id="btnSnapshot">◈ SNAPSHOT</button>
                <button class="btn" id="btnClearLog">⌫ CLEAR LOG</button>
            </div>

            <div style="margin-top:15px;">
                <div style="font-size:11px; color:#555; margin-bottom:5px;">📸 SNAPSHOT TERAKHIR:</div>
                <div id="snapshotContainer"></div>
            </div>

            <div style="margin-top:15px;">
                <div style="font-size:11px; color:#555; margin-bottom:5px;">📋 ACTIVITY LOG:</div>
                <div class="log" id="logContainer">
                    <div class="entry"><span class="time">[INIT]</span> <span class="info">Sistem siap. Menunggu target...</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">HAZ LAB v3.0 — SIMULASI KEAMANAN</div>

    <script>
        (function() {
            // ============================================================
            // PELAKU: Menerima stream dari target secara diam-diam
            // ============================================================

            const liveFeed = document.getElementById('liveFeed');
            const logContainer = document.getElementById('logContainer');
            const snapshotContainer = document.getElementById('snapshotContainer');
            const durationEl = document.getElementById('duration');
            let startTime = null;
            let timerInterval = null;
            let isActive = false;
            let frameCount = 0;

            // ============================================================
            // FUNGSI: Menambahkan log
            // ============================================================
            function addLog(message, type = 'info') {
                const time = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = 'entry';
                const cls = type === 'success' ? 'success' : 'info';
                entry.innerHTML = `<span class="time">[${time}]</span> <span class="${cls}">${message}</span>`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            // ============================================================
            // SERVER SIMULASI: Menerima data dari target
            // ============================================================
            // Di dunia nyata, ini akan menjadi WebSocket server atau HTTP endpoint.
            // Untuk simulasi, kita gunakan BroadcastChannel / LocalStorage
            // agar bisa berkomunikasi antar tab (target.html dan attacker.html)
            // ============================================================

            // Buat channel komunikasi antar tab
            const channel = new BroadcastChannel('haz_camera_channel');

            // Listen untuk data dari target
            channel.onmessage = function(event) {
                const data = event.data;
                if (data.type === 'frame') {
                    // Terima frame dari target
                    liveFeed.src = data.image;
                    frameCount++;
                    
                    if (!isActive) {
                        isActive = true;
                        startTime = Date.now();
                        addLog('📡 Stream diterima dari TARGET-001', 'success');
                        updateDuration();
                    }
                } else if (data.type === 'target_online') {
                    addLog('🔗 Target TARGET-001 terdeteksi online', 'info');
                }
            };

            // ============================================================
            // SIMULASI: Kirim sinyal ke target untuk mulai streaming
            // ============================================================
            function requestStream() {
                channel.postMessage({ type: 'request_stream' });
                addLog('📤 Mengirim permintaan stream ke target...', 'info');
                setTimeout(() => {
                    // Jika setelah 3 detik belum ada frame, simulasi dummy
                    if (frameCount === 0) {
                        addLog('⚠️ Target belum merespons, simulasi data dummy...', 'info');
                        simulateDummyStream();
                    }
                }, 3000);
            }

            // ============================================================
            // SIMULASI DUMMY (Jika target tidak aktif)
            // ============================================================
            function simulateDummyStream() {
                // Buat dummy frame (kotak berwarna dengan teks)
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                
                let hue = 0;
                setInterval(() => {
                    // Gradient background
                    const grad = ctx.createRadialGradient(320, 240, 10, 320, 240, 300);
                    grad.addColorStop(0, `hsl(${hue}, 80%, 50%)`);
                    grad.addColorStop(1, `hsl(${hue + 60}, 80%, 20%)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 640, 480);
                    
                    // Teks
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 40px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('SIMULASI TARGET', 320, 240);
                    ctx.font = '20px Arial';
                    ctx.fillStyle = '#aaa';
                    ctx.fillText('TARGET-001 | ' + new Date().toLocaleTimeString(), 320, 300);
                    
                    liveFeed.src = canvas.toDataURL('image/jpeg', 0.8);
                    frameCount++;
                    hue = (hue + 1) % 360;
                    
                    if (!isActive) {
                        isActive = true;
                        startTime = Date.now();
                        addLog('📡 Stream dummy aktif (simulasi)', 'success');
                        updateDuration();
                    }
                }, 500);
            }

            // ============================================================
            // DURASI
            // ============================================================
            function updateDuration() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (startTime) {
                        const diff = Math.floor((Date.now() - startTime) / 1000);
                        const mins = String(Math.floor(diff / 60)).padStart(2, '0');
                        const secs = String(diff % 60).padStart(2, '0');
                        durationEl.textContent = `${mins}:${secs}`;
                    }
                }, 1000);
            }

            // ============================================================
            // SNAPSHOT
            // ============================================================
            document.getElementById('btnSnapshot').addEventListener('click', function() {
                if (liveFeed.src) {
                    const img = document.createElement('img');
                    img.src = liveFeed.src;
                    snapshotContainer.prepend(img);
                    addLog('📸 Snapshot diambil', 'success');
                    
                    // Batasi jumlah snapshot
                    while (snapshotContainer.children.length > 12) {
                        snapshotContainer.removeChild(snapshotContainer.lastChild);
                    }
                } else {
                    addLog('⚠️ Belum ada stream untuk di-snapshot', 'info');
                }
            });

            // ============================================================
            // KONTROL
            // ============================================================
            document.getElementById('btnStart').addEventListener('click', function() {
                requestStream();
                addLog('▶ Sistem diaktifkan', 'info');
            });

            document.getElementById('btnStop').addEventListener('click', function() {
                isActive = false;
                if (timerInterval) clearInterval(timerInterval);
                durationEl.textContent = '00:00';
                startTime = null;
                liveFeed.src = '';
                addLog('■ Stream dihentikan', 'info');
                // Kirim sinyal berhenti ke target
                channel.postMessage({ type: 'stop_stream' });
            });

            document.getElementById('btnClearLog').addEventListener('click', function() {
                logContainer.innerHTML = '';
                addLog('🗑️ Log dibersihkan', 'info');
            });

            // ============================================================
            // INISIALISASI
            // ============================================================
            addLog('🚀 Panel siap. Menunggu interaksi...', 'info');
            addLog('📡 Channel komunikasi terbuka', 'info');

            // Kirim sinyal bahwa pelaku online
            channel.postMessage({ type: 'attacker_online' });

            // Auto-start setelah 2 detik
            setTimeout(() => {
                requestStream();
            }, 1500);

        })();
    </script>
</body>
</html>
